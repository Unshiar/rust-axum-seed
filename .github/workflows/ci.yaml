name: Rust CI

on: push

jobs:
  fmt_and_clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --check

      - name: clippy app
        run: cargo clippy -- -D warnings

      - name: clippy unit tests
        run: cargo clippy --tests -- -D warnings

      - name: clippy integration tests
        run: cargo clippy --test integration_test -- -D warnings

  tests:
    runs-on: ubuntu-latest
    needs: fmt_and_clippy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Cargo build
        run: cargo build

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test integration_test
