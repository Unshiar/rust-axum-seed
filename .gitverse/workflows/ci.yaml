name: Rust CI

on: push

jobs:
  fmt_and_clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --check

      - name: clippy app
        run: cargo clippy

      - name: clippy unit tests
        run: cargo clippy --lib

      - name: clippy integration tests
        run: cargo clippy --test integration_test

  tests:
    runs-on: ubuntu-latest
    needs: fmt_and_clippy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cargo build
        run: cargo build

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test integration_test
